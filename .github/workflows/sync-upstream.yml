name: Sync upstream

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'yuruichang/dsh-purge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream master
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GH_REPO/merge-upstream" \
            -f branch=master > "$RUNNER_TEMP/sync-result.json"
          cat "$RUNNER_TEMP/sync-result.json"
          {
            echo '### Upstream sync'
            echo 'Merged the direct upstream into master without force pushing.'
            echo '```json'
            cat "$RUNNER_TEMP/sync-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Explain sync failure
        if: failure()
        run: |
          echo '::error::Upstream sync failed. Resolve merge conflicts manually. If upstream changed workflow files, configure UPSTREAM_SYNC_TOKEN with repository contents and workflow write permissions, then rerun.'
